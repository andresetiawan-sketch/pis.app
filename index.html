    <script type="module">
if (window.self === window.top) {
  let lastPath = "";
  function getPageNameFromPath(path) {
    const segments = path.split("/").filter(Boolean);
    return segments[0] || null;
  }
  function trackPageView() {
    const path = window.location.pathname;
    if (path === lastPath) return;
    lastPath = path;
    const pageName = getPageNameFromPath(path) || "home";
    const appId = "";
    if (!appId) return;
    fetch(`/api/app-logs/${appId}/log-user-in-app/${pageName}`, {
      method: "POST",
    }).catch(() => {});
  }
  const originalPushState = history.pushState.bind(history);
  history.pushState = function (...args) {
    originalPushState(...args);
    trackPageView();
  };
  const originalReplaceState = history.replaceState.bind(history);
  history.replaceState = function (...args) {
    originalReplaceState(...args);
    trackPageView();
  };
  window.addEventListener("popstate", trackPageView);
  trackPageView();
}
</script>

    <script type="module">
      // ── 2) Kartu admin: ganti logo & favicon ──
      // Otomatis tampil hanya ketika berada di halaman Pengaturan (/AppSettings)
      // dan yang login adalah Master Admin — tidak lagi berupa tombol mengambang
      // yang muncul di semua halaman.
      const brandCard = document.getElementById("pis-brand-card");
      const ADMIN_ROLES = ["Master Admin", "Admin", "admin", "master_admin"];

      function currentEmployee() {
        try { return JSON.parse(localStorage.getItem("pis_employee") || "null"); } catch { return null; }
      }
      function isOnSettingsPage() {
        return window.location.pathname.replace(/\/+$/, "").toLowerCase() === "/appsettings";
      }
      function refreshBrandCard() {
        const emp = currentEmployee();
        const shouldShow = isOnSettingsPage() && emp && ADMIN_ROLES.includes(emp.role);
        brandCard.classList.toggle("show", !!shouldShow);
      }
      refreshBrandCard();
      window.addEventListener("storage", refreshBrandCard);
      window.addEventListener("popstate", refreshBrandCard);
      setInterval(refreshBrandCard, 1500); // navigasi SPA (pushState) tidak selalu memicu event storage/popstate

      document.getElementById("pis-brand-close").addEventListener("click", () => { brandCard.classList.remove("show"); });

      document.getElementById("pis-brand-save").addEventListener("click", async () => {
        const name = document.getElementById("pis-brand-name").value.trim();
        const logo = document.getElementById("pis-brand-logo").files[0];
        const favicon = document.getElementById("pis-brand-favicon").files[0];
        if (!name && !logo && !favicon) return;

        const fd = new FormData();
        if (name) fd.append("app_name", name);
        if (logo) fd.append("logo", logo);
        if (favicon) fd.append("favicon", favicon);

        const token = localStorage.getItem("token");
        try {
          const res = await fetch("/api/settings/branding", {
            method: "POST",
            headers: token ? { "X-Employee-Token": token } : {},
            body: fd,
          });
          const data = await res.json();
          if (!data.success) { alert(data.error || "Gagal menyimpan"); return; }
          // Cache-bust supaya favicon/logo baru langsung terlihat
          const bust = "?t=" + Date.now();
          document.getElementById("pis-favicon").href = "/branding/favicon" + bust;
          document.title = data.app_name || document.title;
          alert("Berhasil disimpan. Memuat ulang halaman...");
          location.reload();
        } catch (e) {
          alert("Gagal terhubung ke server: " + e.message);
        }
      });
    </script>

    <!-- Fix: Radix UI DialogContent aria-describedby warning suppressor -->
    <script>
      // Radix UI <DialogContent> menampilkan warning jika tidak ada Description.
      // Patch ini menekan warning tersebut di console tanpa mengubah bundle JS.
      (function () {
        const _warn = console.warn.bind(console);
        console.warn = function (...args) {
          const msg = args[0];
          if (
            typeof msg === "string" &&
            (msg.includes("aria-describedby") ||
              msg.includes("Missing `Description`") ||
              msg.includes("DialogContent"))
          ) {
            return; // tekan warning ini
          }
          _warn(...args);
        };
      })();
    </script>
